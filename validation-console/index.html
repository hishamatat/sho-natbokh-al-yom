<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7c2d12">
  <title>لوحة تجربة شو نطبخ اليوم؟</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">تجربة الكويت اليدوية · V00</p>
      <h1>شو نطبخ اليوم؟</h1>
      <p class="subtitle">دليل بسيط لإدارة العائلات والجلسات والنتائج</p>
    </div>
    <div id="saveState" class="save-state" aria-live="polite">محفوظ على هذا الجهاز</div>
  </header>

  <nav class="nav" aria-label="التنقل الرئيسي">
    <button data-view="dashboard" class="active">الرئيسية</button>
    <button data-view="messages">الرسائل</button>
    <button data-view="families">العائلات</button>
    <button data-view="session">جلسة جديدة</button>
    <button data-view="recipes">الوصفات</button>
    <button data-view="report">النتائج</button>
    <button data-view="settings">التجهيز</button>
  </nav>

  <main id="app" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
